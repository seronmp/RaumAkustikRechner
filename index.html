<!DOCTYPE html>
<html lang="de" x-data="acousticsApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raumakustik Rechner | Calcolatore Acustico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-p-6">
    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <!-- Header & Language Switcher -->
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm">
            <h1 class="text-2xl font-bold text-slate-900" x-text="t.title"></h1>
            <div class="flex gap-2">
                <button @click="lang = 'de'" :class="lang === 'de' ? 'bg-blue-600 text-white' : 'bg-slate-200'" class="px-3 py-1 rounded font-medium text-sm transition">DE</button>
                <button @click="lang = 'ita'" :class="lang === 'ita' ? 'bg-blue-600 text-white' : 'bg-slate-200'" class="px-3 py-1 rounded font-medium text-sm transition">ITA</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Inputs Panel -->
            <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-1 space-y-4">
                <h2 class="text-lg font-semibold border-b pb-2" x-text="t.params"></h2>
                
                <div>
                    <label class="block text-sm font-medium" x-text="t.projectName"></label>
                    <input type="text" x-model="projectName" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium" x-text="t.customerName"></label>
                    <input type="text" x-model="customerName" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-medium" x-text="t.length"></label>
                        <input type="number" step="0.1" x-model.number="length" @input="calculate" class="w-full mt-1 p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-medium" x-text="t.width"></label>
                        <input type="number" step="0.1" x-model.number="width" @input="calculate" class="w-full mt-1 p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-medium" x-text="t.height"></label>
                        <input type="number" step="0.1" x-model.number="height" @input="calculate" class="w-full mt-1 p-2 border rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium" x-text="t.floor"></label>
                    <select x-model="floorMaterial" @change="calculate" class="w-full mt-1 p-2 border rounded-lg">
                        <option value="parket">Parkett / Wooden Floor (0.05)</option>
                        <option value="beton">Beton / Concrete (0.02)</option>
                        <option value="teppich">Teppich / Carpet (0.25)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium" x-text="t.wall"></label>
                    <select x-model="wallMaterial" @change="calculate" class="w-full mt-1 p-2 border rounded-lg">
                        <option value="putz">Putz / Plaster (0.04)</option>
                        <option value="glas">Glas / Glass (0.03)</option>
                        <option value="basotect">Basotect Akustik (0.80)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium" x-text="t.ceiling"></label>
                    <select x-model="ceilingMaterial" @change="calculate" class="w-full mt-1 p-2 border rounded-lg">
                        <option value="beton">Beton / Concrete (0.02)</option>
                        <option value="fibrotech">FibroTech Akustik Paneele (0.65)</option>
                        <option value="stratocell">Stratocell Whisper (0.85)</option>
                    </select>
                </div>

                <button @click="saveProject" class="w-full bg-emerald-600 text-white p-3 rounded-lg font-semibold hover:bg-emerald-700 transition" x-text="t.saveBtn"></button>
                <p x-text="saveStatus" class="text-sm text-center font-medium mt-2"></p>
            </div>

            <!-- Results & Simulation Panel -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Metrics Cards -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm">
                        <h3 class="text-sm text-slate-500" x-text="t.volume"></h3>
                        <p class="text-2xl font-bold text-slate-900" x-text="volume + ' m³'"></p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm">
                        <h3 class="text-sm text-slate-500" x-text="t.rtCurrent"></h3>
                        <p class="text-2xl font-bold text-blue-600" x-text="avgRtCurrent + ' s'"></p>
                    </div>
                </div>

                <!-- Chart Container -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-semibold mb-4" x-text="t.chartTitle"></h3>
                    <div class="relative h-72">
                        <canvas id="acousticsChart"></canvas>
                    </div>
                </div>

                <!-- Audio Simulation Panel (Prima / Dopo) -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-semibold mb-2" x-text="t.audioTitle"></h3>
                    <p class="text-sm text-slate-500 mb-4" x-text="t.audioDesc"></p>
                    <div class="flex gap-4">
                        <button @click="playAudio('before')" class="flex-1 bg-amber-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-amber-700 transition" x-text="t.playBefore"></button>
                        <button @click="playAudio('after')" class="flex-1 bg-indigo-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-indigo-700 transition" x-text="t.playAfter"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            de: {
                title: "Raumakustik & Nachhallzeit Rechner",
                params: "Raumparameter",
                projectName: "Projektname",
                customerName: "Kunde",
                length: "Länge (m)",
                width: "Breite (m)",
                height: "Höhe (m)",
                floor: "Bodenbelag",
                wall: "Wandmaterial",
                ceiling: "Decke",
                saveBtn: "In Neon DB speichern",
                volume: "Raumvolumen",
                rtCurrent: "Mittlere Nachhallzeit (Ist)",
                chartTitle: "Nachhallzeit T60 nach Frequenzen (Sekunden)",
                audioTitle: "Akustik-Simulation (Vorher / Nachher)",
                audioDesc: "Hören Sie den simulierten Nachhall im Raum vor und nach dem Akustik-Setup.",
                playBefore: "Vorher (Ohne Dämmung)",
                playAfter: "Nachher (Mit Akustik)",
                saved: "Erfolgreich gespeichert!",
                error: "Fehler beim Speichern."
            },
            ita: {
                title: "Calcolatore Acustico e Tempo di Riverbero",
                params: "Parametri della Stanza",
                projectName: "Nome Progetto",
                customerName: "Cliente",
                length: "Lunghezza (m)",
                width: "Larghezza (m)",
                height: "Altezza (m)",
                floor: "Pavimento",
                wall: "Materiale Pareti",
                ceiling: "Soffitto",
                saveBtn: "Salva nel Database Neon",
                volume: "Volume Stanza",
                rtCurrent: "Tempo di Riverbero Medio (Attuale)",
                chartTitle: "Tempo di Riverbero T60 per Frequenze (Secondi)",
                audioTitle: "Simulazione Acustica (Prima / Dopo)",
                audioDesc: "Ascolta il riverbero simulato nella stanza prima e dopo l'intervento acustico.",
                playBefore: "Prima (Senza Pannelli)",
                playAfter: "Dopo (Con Trattamento)",
                saved: "Salvato con successo!",
                error: "Errore durante il salvataggio."
            }
        };

        const absorptionCoefficients = {
            parket: { 125: 0.04, 250: 0.04, 500: 0.03, 1000: 0.03, 2000: 0.02, 4000: 0.02 },
            beton: { 125: 0.01, 250: 0.01, 500: 0.02, 1000: 0.02, 2000: 0.03, 4000: 0.04 },
            teppich: { 125: 0.02, 250: 0.08, 500: 0.25, 1000: 0.45, 2000: 0.65, 4000: 0.75 },
            putz: { 125: 0.02, 250: 0.03, 500: 0.04, 1000: 0.05, 2000: 0.04, 4000: 0.03 },
            glas: { 125: 0.10, 250: 0.05, 500: 0.03, 1000: 0.02, 2000: 0.02, 4000: 0.02 },
            basotect: { 125: 0.15, 250: 0.45, 500: 0.85, 1000: 0.95, 2000: 0.95, 4000: 0.90 },
            fibrotech: { 125: 0.10, 250: 0.30, 500: 0.75, 1000: 0.90, 2000: 0.80, 4000: 0.70 },
            stratocell: { 125: 0.20, 250: 0.55, 500: 0.90, 1000: 0.95, 2000: 0.90, 4000: 0.85 }
        };

        function acousticsApp() {
            return {
                lang: 'ita',
                projectName: 'Ufficio Seron',
                customerName: 'Cliente Test',
                length: 6.0,
                width: 4.0,
                height: 2.8,
                floorMaterial: 'parket',
                wallMaterial: 'putz',
                ceilingMaterial: 'beton',
                volume: 67.2,
                avgRtCurrent: 0.0,
                rtCurrentData: [0, 0, 0, 0, 0, 0],
                rtOptimizedData: [0, 0, 0, 0, 0, 0],
                saveStatus: '',
                chart: null,
                frequencies: ['125 Hz', '250 Hz', '500 Hz', '1000 Hz', '2000 Hz', '4000 Hz'],

                get t() { return translations[this.lang]; },

                init() {
                    this.calculate();
                    this.$nextTick(() => {
                        const ctx = document.getElementById('acousticsChart').getContext('2d');
                        this.chart = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: this.frequencies,
                                datasets: [
                                    {
                                        label: 'T60 Attuale (s)',
                                        data: this.rtCurrentData,
                                        borderColor: '#2563eb',
                                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                                        tension: 0.2,
                                        fill: true
                                    },
                                    {
                                        label: 'T60 Ottimizzato (s)',
                                        data: this.rtOptimizedData,
                                        borderColor: '#10b981',
                                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                        tension: 0.2,
                                        fill: true
                                    }
                                ]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: { y: { beginAtZero: true, max: 3.0 } }
                            }
                        });
                    });
                },

                calculate() {
                    this.volume = parseFloat((this.length * this.width * this.height).toFixed(2));
                    const floorArea = this.length * this.width;
                    const wallArea = 2 * (this.length + this.height) * this.height;
                    const ceilingArea = floorArea;
                    const totalArea = floorArea + wallArea + ceilingArea;

                    const freqs = [125, 250, 500, 1000, 2000, 4000];
                    let currentRtList = [];
                    let optimizedRtList = [];

                    freqs.forEach(f => {
                        // Assorbimento attuale
                        const aFloor = absorptionCoefficients[this.floorMaterial][f] * floorArea;
                        const aWall = absorptionCoefficients[this.wallMaterial][f] * wallArea;
                        const aCeiling = absorptionCoefficients[this.ceilingMaterial][f] * ceilingArea;
                        const totalAbsorptionCurrent = aFloor + aWall + aCeiling + (0.16 * this.volume / 30); // aria + base
                        
                        let rtCurr = (0.16 * this.volume) / totalAbsorptionCurrent;
                        currentRtList.push(parseFloat(rtCurr.toFixed(2)));

                        // Ottimizzato (simulando l'aggiunta di pannelli fonoassorbenti a parete/soffitto)
                        const aWallOpt = 0.85 * (wallArea * 0.4) + absorptionCoefficients[this.wallMaterial][f] * (wallArea * 0.6);
                        const totalAbsorptionOpt = aFloor + aWallOpt + aCeiling + (0.16 * this.volume / 30);
                        let rtOpt = (0.16 * this.volume) / totalAbsorptionOpt;
                        optimizedRtList.push(parseFloat(rtOpt.toFixed(2)));
                    });

                    this.rtCurrentData = currentRtList;
                    this.rtOptimizedData = optimizedRtList;
                    
                    const sum = currentRtList.reduce((a, b) => a + b, 0);
                    this.avgRtCurrent = parseFloat((sum / currentRtList.length).toFixed(2));

                    if (this.chart) {
                        this.chart.data.datasets[0].data = this.rtCurrentData;
                        this.chart.data.datasets[1].data = this.rtOptimizedData;
                        this.chart.update();
                    }
                },

                playAudio(type) {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const bufferSize = audioCtx.sampleRate * 2;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = buffer.getChannelData(0);

                    // Genera rumore bianco
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }

                    const whiteNoise = audioCtx.createBufferSource();
                    whiteNoise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = type === 'before' ? 3000 : 1200; // Taglio diverso per simulare l'assorbimento

                    const gainNode = audioCtx.createGain();
                    const now = audioCtx.currentTime;
                    
                    // Invviluppo sonoro simulato (Decadimento/Riverbero)
                    const decay = type === 'before' ? 1.8 : 0.4; 
                    gainNode.gain.setValueAtTime(0.5, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + decay);

                    whiteNoise.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    whiteNoise.start(now);
                    whiteNoise.stop(now + decay);
                },

                async saveProject() {
                    try {
                        const response = await fetch('/api/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                project_name: this.projectName,
                                customer_name: this.customerName,
                                length: this.length,
                                width: this.width,
                                height: this.height,
                                floor_material: this.floorMaterial,
                                wall_material: this.wallMaterial,
                                ceiling_material: this.ceilingMaterial,
                                volume: this.volume,
                                rt_current: this.rtCurrentData,
                                rt_optimized: this.rtOptimizedData
                            })
                        });
                        const data = await response.json();
                        if (data.success) {
                            this.saveStatus = this.t.saved;
                        } else {
                            this.saveStatus = this.t.error;
                        }
                    } catch (e) {
                        this.saveStatus = this.t.error;
                    }
                }
            }
        }
    </script>
</body>
</html>
