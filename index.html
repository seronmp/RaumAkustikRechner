<!DOCTYPE html>
<html lang="de" x-data="acousticsApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raumakustik Rechner | Calcolatore Acustico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header & Language Switcher -->
        <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
            <h1 class="text-2xl font-bold text-slate-900" x-text="t.title"></h1>
            <div class="flex gap-2">
                <button @click="lang = 'de'" :class="lang === 'de' ? 'bg-blue-600 text-white' : 'bg-slate-200'" class="px-3 py-1 rounded font-medium text-sm transition">DE</button>
                <button @click="lang = 'ita'" :class="lang === 'ita' ? 'bg-blue-600 text-white' : 'bg-slate-200'" class="px-3 py-1 rounded font-medium text-sm transition">ITA</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Inputs Panel -->
            <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-1 space-y-4">
                <h2 class="text-lg font-semibold border-b pb-2" x-text="t.params"></h2>
                
                <div>
                    <label class="block text-sm font-medium" x-text="t.projectName"></label>
                    <input type="text" x-model="projectName" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium" x-text="t.customerName"></label>
                    <input type="text" x-model="customerName" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-medium" x-text="t.length"></label>
                        <input type="number" step="0.1" x-model.number="length" @input="updateDimensions" class="w-full mt-1 p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-medium" x-text="t.width"></label>
                        <input type="number" step="0.1" x-model.number="width" @input="updateDimensions" class="w-full mt-1 p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-medium" x-text="t.height"></label>
                        <input type="number" step="0.1" x-model.number="height" @input="updateDimensions" class="w-full mt-1 p-2 border rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium" x-text="t.floor"></label>
                    <select x-model="floorMaterial" @change="updateDimensions" class="w-full mt-1 p-2 border rounded-lg">
                        <option value="parket">Parkett / Wooden Floor (0.05)</option>
                        <option value="beton">Beton / Concrete (0.02)</option>
                        <option value="teppich">Teppich / Carpet (0.25)</option>
                    </select>
                </div>

                <!-- Wall Materials breakdown by m² with auto-balancing -->
                <div class="border-t pt-3 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-700" x-text="t.wallsBreakdown"></label>
                        <span class="text-xs text-slate-500" x-text="t.totalWalls + ': ' + totalWallArea + ' m²'"></span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <span class="text-slate-600">Glas / Fenster (m²)</span>
                            <input type="number" step="0.5" x-model.number="walls.glas" @input="onWallAreaChange('glas')" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                        <div>
                            <span class="text-slate-600">Putz (m²)</span>
                            <input type="number" step="0.5" x-model.number="walls.putz" @input="onWallAreaChange('putz')" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                        <div>
                            <span class="text-slate-600">Holz (m²)</span>
                            <input type="number" step="0.5" x-model.number="walls.holz" @input="onWallAreaChange('holz')" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                        <div>
                            <span class="text-slate-600">Beton (m²)</span>
                            <input type="number" step="0.5" x-model.number="walls.beton" @input="onWallAreaChange('beton')" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                    </div>
                </div>

                <!-- Ceiling Materials breakdown by m² -->
                <div class="border-t pt-3 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-700" x-text="t.ceilingBreakdown"></label>
                        <span class="text-xs text-slate-500" x-text="t.totalCeiling + ': ' + totalCeilingArea + ' m²'"></span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <span class="text-slate-600">Beton Decke (m²)</span>
                            <input type="number" step="0.5" x-model.number="ceiling.beton" @input="onCeilingAreaChange('beton')" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                        <div>
                            <span class="text-slate-600">Holz Decke (m²)</span>
                            <input type="number" step="0.5" x-model.number="ceiling.holz" @input="onCeilingAreaChange('holz')" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                    </div>
                </div>

                <!-- Catalog Treatment Configuration with Percentage Selector -->
                <div class="border-t pt-4 space-y-3 bg-indigo-50/50 p-3 rounded-lg border">
                    <h3 class="text-sm font-semibold text-indigo-700" x-text="t.treatmentTitle"></h3>
                    
                    <div>
                        <label class="block text-xs font-medium" x-text="t.productSelect"></label>
                        <select x-model="selectedProduct" @change="calculate" class="w-full mt-1 p-2 border rounded-lg text-sm bg-white">
                            <option value="melamina">Schiuma di Melamina / Basotect (5 cm)</option>
                            <option value="poliuretano">Poliuretano Espanso (5 cm)</option>
                            <option value="stratocell">Stratocell Whisper (5 cm)</option>
                            <option value="poliestere">Fibra di Poliestere (5 cm)</option>
                            <option value="fibrotech">FibroTech Pannelli dogati</option>
                        </select>
                    </div>

                    <div>
                        <div class="flex justify-between items-center text-xs font-medium">
                            <span x-text="t.treatmentPercentage"></span>
                            <span class="text-indigo-600 font-bold" x-text="coveragePercentage + '% (' + coverageSquareMeters + ' m²)'"></span>
                        </div>
                        <input type="range" min="0" max="100" step="5" x-model.number="coveragePercentage" @input="updatePercentage" @change="updatePercentage" class="w-full mt-2 accent-indigo-600">
                    </div>
                </div>

                <button @click="saveProject" class="w-full bg-emerald-600 text-white p-3 rounded-lg font-semibold hover:bg-emerald-700 transition" x-text="t.saveBtn"></button>
                <p x-text="saveStatus" class="text-sm text-center font-medium mt-2"></p>
            </div>

            <!-- Results & Simulation Panel -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Metrics Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-blue-500">
                        <p class="text-xs text-slate-500 mb-1">Volume</p>
                        <p class="text-2xl font-bold text-blue-600" x-text="volume + ' m³'"></p>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-emerald-500">
                        <p class="text-xs text-slate-500 mb-1">RT60 Medio Attuale</p>
                        <p class="text-2xl font-bold text-emerald-600" x-text="avgRtCurrent + ' s'"></p>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-orange-500">
                        <p class="text-xs text-slate-500 mb-1">RT60 Medio Ottimale</p>
                        <p class="text-2xl font-bold text-orange-600" x-text="'0.50 s'"></p>
                    </div>
                    <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-purple-500">
                        <p class="text-xs text-slate-500 mb-1">RT60 Medio Trattato</p>
                        <p class="text-2xl font-bold text-purple-600" x-text="avgRtTreated + ' s'"></p>
                    </div>
                </div>

                <!-- Chart -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-semibold mb-4">RT60 Simulation</h3>
                    <canvas id="rtChart" style="max-height: 400px;"></canvas>
                </div>

                <!-- Manual RT60 Input Section -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-semibold mb-4 border-b pb-2">Modifica Manuale Valori RT60</h3>
                    <p class="text-sm text-slate-600 mb-4">Modifica i valori sotto per regolare il grafico direttamente:</p>
                    
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <template x-for="(value, idx) in rtCurrentData" :key="idx">
                            <div>
                                <label class="block text-xs font-medium text-slate-700 mb-1">
                                    <span x-text="frequencies[idx] + ' Hz'"></span>
                                </label>
                                <input 
                                    type="number" 
                                    step="0.1" 
                                    min="0.1" 
                                    max="5"
                                    @input="rtCurrentData[idx] = parseFloat($event.target.value); updateChartFromManual()"
                                    :value="value"
                                    class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
                                >
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Audio Simulation -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-semibold mb-4 border-b pb-2">Audio Simulation</h3>
                    <div class="flex gap-3">
                        <button @click="playAudio('before')" :disabled="isPlayingBefore" class="flex-1 bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                            <span x-text="isPlayingBefore ? 'Playing Before...' : 'Play Before (Current RT60)'"></span>
                        </button>
                        <button @click="playAudio('after')" :disabled="isPlayingAfter" class="flex-1 bg-emerald-600 text-white p-3 rounded-lg font-semibold hover:bg-emerald-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                            <span x-text="isPlayingAfter ? 'Playing After...' : 'Play After (Treated RT60)'"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const productCoefficients = {
            melamina: { 125: 0.12, 250: 0.20, 500: 0.55, 1000: 0.80, 2000: 0.78, 4000: 0.65 },
            poliuretano: { 125: 0.08, 250: 0.18, 500: 0.45, 1000: 0.72, 2000: 0.70, 4000: 0.60 },
            stratocell: { 125: 0.10, 250: 0.22, 500: 0.60, 1000: 0.85, 2000: 0.82, 4000: 0.72 },
            poliestere: { 125: 0.15, 250: 0.25, 500: 0.50, 1000: 0.75, 2000: 0.76, 4000: 0.68 },
            fibrotech: { 125: 0.18, 250: 0.35, 500: 0.70, 1000: 0.90, 2000: 0.88, 4000: 0.80 }
        };

        const absorptionCoefficients = {
            parket: { 125: 0.05, 250: 0.08, 500: 0.10, 1000: 0.12, 2000: 0.14, 4000: 0.13 },
            beton: { 125: 0.02, 250: 0.02, 500: 0.03, 1000: 0.04, 2000: 0.05, 4000: 0.05 },
            teppich: { 125: 0.20, 250: 0.35, 500: 0.50, 1000: 0.60, 2000: 0.65, 4000: 0.70 },
            glas: { 125: 0.03, 250: 0.04, 500: 0.05, 1000: 0.06, 2000: 0.07, 4000: 0.08 },
            putz: { 125: 0.05, 250: 0.06, 500: 0.07, 1000: 0.08, 2000: 0.08, 4000: 0.07 },
            holz: { 125: 0.15, 250: 0.18, 500: 0.15, 1000: 0.10, 2000: 0.12, 4000: 0.15 }
        };

        function acousticsApp() {
            return {
                lang: 'de',
                projectName: 'Mein Projekt',
                customerName: 'Kunde ABC',
                length: 10,
                width: 8,
                height: 3,
                floorMaterial: 'parket',
                walls: { glas: 5, putz: 20, holz: 5, beton: 10 },
                ceiling: { beton: 40, holz: 20 },
                selectedProduct: 'melamina',
                coveragePercentage: 50,
                coverageSquareMeters: 30,
                volume: 240,
                frequencies: [125, 250, 500, 1000, 2000, 4000],
                rtCurrentData: [2.0, 1.8, 1.5, 1.3, 1.2, 1.1],
                rtOptimizedData: [0.50, 0.50, 0.50, 0.50, 0.50, 0.50],
                rtTreatedData: [1.0, 0.9, 0.7, 0.6, 0.55, 0.50],
                avgRtCurrent: 1.48,
                avgRtTreated: 0.73,
                chart: null,
                isPlayingBefore: false,
                isPlayingAfter: false,
                saveStatus: '',

                get totalWallArea() {
                    return this.walls.glas + this.walls.putz + this.walls.holz + this.walls.beton;
                },
                get totalCeilingArea() {
                    return this.ceiling.beton + this.ceiling.holz;
                },

                get t() {
                    return {
                        title: this.lang === 'de' ? 'Raumakustik Rechner' : 'Calcolatore Acustico',
                        params: this.lang === 'de' ? 'Parameter' : 'Parametri',
                        projectName: this.lang === 'de' ? 'Projektname' : 'Nome Progetto',
                        customerName: this.lang === 'de' ? 'Kundenname' : 'Nome Cliente',
                        length: this.lang === 'de' ? 'Länge (m)' : 'Lunghezza (m)',
                        width: this.lang === 'de' ? 'Breite (m)' : 'Larghezza (m)',
                        height: this.lang === 'de' ? 'Höhe (m)' : 'Altezza (m)',
                        floor: this.lang === 'de' ? 'Bodenbelag' : 'Pavimento',
                        wallsBreakdown: this.lang === 'de' ? 'Wandflächen' : 'Aree Muri',
                        totalWalls: this.lang === 'de' ? 'Gesamt' : 'Totale',
                        ceilingBreakdown: this.lang === 'de' ? 'Deckenbereiche' : 'Aree Soffitto',
                        totalCeiling: this.lang === 'de' ? 'Gesamt' : 'Totale',
                        treatmentTitle: this.lang === 'de' ? 'Behandlung' : 'Trattamento',
                        productSelect: this.lang === 'de' ? 'Produkt wählen' : 'Seleziona Prodotto',
                        treatmentPercentage: this.lang === 'de' ? 'Behandlungsfläche' : 'Area Trattamento',
                        saveBtn: this.lang === 'de' ? 'Projekt speichern' : 'Salva Progetto',
                        saved: this.lang === 'de' ? 'Projekt gespeichert!' : 'Progetto salvato!',
                        error: this.lang === 'de' ? 'Fehler beim Speichern' : 'Errore nel salvataggio'
                    };
                },

                init() {
                    this.$nextTick(() => {
                        this.initChart();
                        this.calculate();
                    });
                },

                initChart() {
                    const ctx = document.getElementById('rtChart');
                    if (ctx) {
                        this.chart = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: ['125 Hz', '250 Hz', '500 Hz', '1000 Hz', '2000 Hz', '4000 Hz'],
                                datasets: [
                                    {
                                        label: 'RT60 Attuale',
                                        data: this.rtCurrentData,
                                        borderColor: 'rgb(59, 130, 246)',
                                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                        borderWidth: 2,
                                        tension: 0.4,
                                        fill: true
                                    },
                                    {
                                        label: 'RT60 Ottimale',
                                        data: this.rtOptimizedData,
                                        borderColor: 'rgb(34, 197, 94)',
                                        backgroundColor: 'rgba(34, 197, 94, 0.1)',
                                        borderWidth: 2,
                                        tension: 0.4,
                                        fill: true
                                    },
                                    {
                                        label: 'RT60 Trattato',
                                        data: this.rtTreatedData,
                                        borderColor: 'rgb(147, 51, 234)',
                                        backgroundColor: 'rgba(147, 51, 234, 0.1)',
                                        borderWidth: 2,
                                        tension: 0.4,
                                        fill: true
                                    }
                                ]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: {
                                    legend: {
                                        display: true,
                                        position: 'top'
                                    }
                                },
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        max: 3,
                                        title: {
                                            display: true,
                                            text: 'RT60 (secondi)'
                                        }
                                    }
                                }
                            }
                        });
                    }
                },

                updateDimensions() {
                    this.calculate();
                },

                onWallAreaChange() {
                    this.calculate();
                },

                onCeilingAreaChange() {
                    this.calculate();
                },

                updatePercentage() {
                    const totalSurface = this.totalWallArea + this.totalCeilingArea;
                    this.coverageSquareMeters = parseFloat(((totalSurface * this.coveragePercentage) / 100).toFixed(1));
                    this.calculate();
                },

                calculate() {
                    this.volume = parseFloat((this.length * this.width * this.height).toFixed(2));
                    
                    const freqs = [125, 250, 500, 1000, 2000, 4000];
                    let treatedRtList = [];
                    let optimizedRtList = [];
                    const floorArea = this.length * this.width;

                    freqs.forEach((f, index) => {
                        optimizedRtList.push(0.50);

                        const aFloor = floorArea * absorptionCoefficients[this.floorMaterial][f];
                        const aWalls = 
                            (this.walls.glas * absorptionCoefficients.glas[f]) +
                            (this.walls.putz * absorptionCoefficients.putz[f]) +
                            (this.walls.holz * absorptionCoefficients.holz[f]) +
                            (this.walls.beton * absorptionCoefficients.beton[f]);
                        const aCeiling = 
                            (this.ceiling.beton * absorptionCoefficients.beton[f]) +
                            (this.ceiling.holz * absorptionCoefficients.holz[f]);

                        const roomAbsorption = aFloor + aWalls + aCeiling;

                        const productAlpha = productCoefficients[this.selectedProduct][f];
                        const maxTreatableArea = this.totalWallArea + this.totalCeilingArea;
                        const treatedArea = Math.min(this.coverageSquareMeters, maxTreatableArea);
                        
                        const treatmentAbsorption = treatedArea * productAlpha;
                        const totalTreatedAbsorption = roomAbsorption + treatmentAbsorption;

                        let rtTreated = totalTreatedAbsorption > 0 ? (0.161 * this.volume) / totalTreatedAbsorption : 0.2;
                        
                        treatedRtList.push(parseFloat(Math.max(0.1, rtTreated).toFixed(2)));
                    });

                    this.rtOptimizedData = optimizedRtList;
                    this.rtTreatedData = treatedRtList;
                    
                    const sumTreated = treatedRtList.reduce((a, b) => a + b, 0);
                    this.avgRtTreated = parseFloat((sumTreated / treatedRtList.length).toFixed(2));

                    this.updateChart();
                },

                updateChartFromManual() {
                    const sum = this.rtCurrentData.reduce((a, b) => a + (parseFloat(b) || 0), 0);
                    this.avgRtCurrent = parseFloat((sum / this.rtCurrentData.length).toFixed(2));
                    this.updateChart();
                },

                updateChart() {
                    if (this.chart) {
                        this.chart.data.datasets[0].data = [...this.rtCurrentData];
                        this.chart.data.datasets[1].data = [...this.rtOptimizedData];
                        this.chart.data.datasets[2].data = [...this.rtTreatedData];
                        this.chart.update('none'); // 'none' = senza animazione per evitare stuttering
                    }
                },

                playAudio(type) {
                    if (type === 'before') this.isPlayingBefore = true;
                    else this.isPlayingAfter = true;

                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const bufferSize = audioCtx.sampleRate * 3;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = buffer.getChannelData(0);

                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }

                    const whiteNoise = audioCtx.createBufferSource();
                    whiteNoise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = type === 'before' ? 3200 : 1400;

                    const gainNode = audioCtx.createGain();
                    const now = audioCtx.currentTime;
                    
                    const decay = type === 'before' ? Math.min(3.0, Math.max(0.8, this.avgRtCurrent)) : Math.min(2.0, Math.max(0.3, this.avgRtTreated));
                    
                    gainNode.gain.setValueAtTime(0.6, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + decay);

                    whiteNoise.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    whiteNoise.start(now);
                    whiteNoise.stop(now + decay);

                    setTimeout(() => {
                        this.isPlayingBefore = false;
                        this.isPlayingAfter = false;
                    }, decay * 1000);
                },

                async saveProject() {
                    try {
                        const response = await fetch('/api/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                project_name: this.projectName,
                                customer_name: this.customerName,
                                length: this.length,
                                width: this.width,
                                height: this.height,
                                volume: this.volume,
                                walls: this.walls,
                                ceiling: this.ceiling,
                                selected_product: this.selectedProduct,
                                coverage_percentage: this.coveragePercentage,
                                coverage_sqm: this.coverageSquareMeters,
                                rt_current: this.rtCurrentData,
                                rt_treated: this.rtTreatedData
                            })
                        });
                        const data = await response.json();
                        if (data.success) {
                            this.saveStatus = this.t.saved;
                        } else {
                            this.saveStatus = this.t.error;
                        }
                    } catch (e) {
                        this.saveStatus = this.t.error;
                    }
                }
            }
        }
    </script>
</body>
</html>
