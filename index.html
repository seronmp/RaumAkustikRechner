<!DOCTYPE html>
<html lang="de" x-data="acousticsApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raumakustik Rechner / Calcolatore Acustico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <!-- Header & Language Switcher -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border gap-4">
            <div>
                <h1 class="text-xl font-bold text-blue-900" x-text="t.title"></h1>
                <p class="text-sm text-gray-500" x-text="t.subtitle"></p>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex bg-gray-200 rounded-lg p-1">
                    <button @click="setLang('de')" :class="lang === 'de' ? 'bg-blue-600 text-white shadow' : 'text-gray-600'" class="px-3 py-1 rounded-md text-sm font-semibold transition">DE</button>
                    <button @click="setLang('ita')" :class="lang === 'ita' ? 'bg-blue-600 text-white shadow' : 'text-gray-600'" class="px-3 py-1 rounded-md text-sm font-semibold transition">ITA</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Column: Inputs (Project, Geometry & Materials) -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Project Info -->
                <div class="bg-white p-5 rounded-xl shadow-sm border">
                    <h2 class="text-md font-semibold mb-3 text-blue-800" x-text="t.projTitle"></h2>
                    <div class="space-y-3 text-sm">
                        <div>
                            <label class="block font-medium text-gray-600" x-text="t.projName"></label>
                            <input type="text" x-model="project.name" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-medium text-gray-600" x-text="t.custName"></label>
                            <input type="text" x-model="project.customer" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- Geometry (Mit Live-Update bei jeder Eingabe) -->
                <div class="bg-white p-5 rounded-xl shadow-sm border">
                    <h2 class="text-md font-semibold mb-3 text-blue-800" x-text="t.geoTitle"></h2>
                    <div class="space-y-3 text-sm">
                        <div>
                            <label class="block font-medium text-gray-600" x-text="t.length"></label>
                            <input type="number" step="0.1" x-model.number="room.length" @input="updateCalc" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-medium text-gray-600" x-text="t.width"></label>
                            <input type="number" step="0.1" x-model.number="room.width" @input="updateCalc" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block font-medium text-gray-600" x-text="t.height"></label>
                            <input type="number" step="0.1" x-model.number="room.height" @input="updateCalc" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div class="mt-4 p-3 bg-blue-50 rounded-lg text-xs space-y-1 text-blue-900">
                        <p><span x-text="t.vol"></span>: <strong x-text="volume + ' m³'"></strong></p>
                        <p><span x-text="t.area"></span>: <strong x-text="totalArea + ' m²'"></strong></p>
                    </div>
                </div>

                <!-- Materials Selection -->
                <div class="bg-white p-5 rounded-xl shadow-sm border">
                    <h2 class="text-md font-semibold mb-3 text-blue-800" x-text="t.matTitle"></h2>
                    <div class="space-y-3 text-sm">
                        <div>
                            <label class="block font-medium text-gray-600" x-text="t.floorMat"></label>
                            <select x-model="materials.floor" @change="updateCalc" class="w-full mt-1 p-2 border rounded-lg bg-white">
                                <option value="parquet" x-text="t.optParquet"></option>
                                <option value="carpet" x-text="t.optCarpet"></option>
                                <option value="tiles" x-text="t.optTiles"></option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium text-gray-600" x-text="t.wallMat"></label>
                            <select x-model="materials.wall" @change="updateCalc" class="w-full mt-1 p-2 border rounded-lg bg-white">
                                <option value="plaster" x-text="t.optPlaster"></option>
                                <option value="concrete" x-text="t.optConcrete"></option>
                                <option value="wood" x-text="t.optWood"></option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium text-gray-600" x-text="t.ceilingMat"></label>
                            <select x-model="materials.ceiling" @change="updateCalc" class="w-full mt-1 p-2 border rounded-lg bg-white">
                                <option value="concrete" x-text="t.optConcrete"></option>
                                <option value="basotect" x-text="t.optAcoustic"></option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Chart & Results Evaluation -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-md font-semibold text-blue-800" x-text="t.chartTitle"></h2>
                            <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded font-medium" x-text="t.statusOk"></span>
                        </div>
                        <div class="relative w-full h-80">
                            <canvas id="rtChart"></canvas>
                        </div>
                    </div>
                    <div class="mt-6 pt-4 border-t flex flex-col sm:flex-row justify-between items-center gap-4">
                        <span class="text-xs text-gray-400" x-text="t.normInfo"></span>
                        <div class="flex gap-2 w-full sm:w-auto">
                            <button @click="saveProject" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium shadow transition text-sm" x-text="t.saveBtn"></button>
                            <button @click="window.print()" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow transition text-sm" x-text="t.exportBtn"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Assorbimento acustico per bande d'ottava [125, 250, 500, 1000, 2000, 4000] Hz
        const dbMat = {
            parquet: [0.04, 0.04, 0.07, 0.06, 0.06, 0.07],
            carpet:  [0.02, 0.05, 0.10, 0.20, 0.40, 0.50],
            tiles:   [0.01, 0.01, 0.01, 0.02, 0.02, 0.02],
            plaster: [0.10, 0.10, 0.15, 0.20, 0.20, 0.15],
            concrete:[0.01, 0.01, 0.02, 0.02, 0.03, 0.04],
            wood:    [0.15, 0.11, 0.10, 0.07, 0.06, 0.07],
            basotect:[0.12, 0.35, 0.75, 0.95, 0.98, 0.95]
        };

        function acousticsApp() {
            return {
                lang: 'de',
                project: { name: 'Musterraum Büro', customer: 'Kunde GmbH' },
                room: { length: 6.0, width: 5.0, height: 3.0 },
                materials: { floor: 'parquet', wall: 'plaster', ceiling: 'concrete' },
                chartInstance: null,
                currentRtValues: [],
                optimizedRtValues: [],
                
                dict: {
                    de: {
                        title: "Raumakustik-Rechner",
                        subtitle: "Nachhallzeit-Berechnung nach Sabine / DIN 18041",
                        projTitle: "Projektdaten",
                        projName: "Projektname",
                        custName: "Kunde",
                        geoTitle: "1. Raumgeometrie",
                        length: "Länge (m)",
                        width: "Breite (m)",
                        height: "Höhe (m)",
                        vol: "Volumen",
                        area: "Fläche",
                        matTitle: "2. Oberflächen & Materialien",
                        floorMat: "Bodenbelag",
                        wallMat: "Wandbekleidung",
                        ceilingMat: "Deckenbekleidung",
                        optParquet: "Parkett / Hartboden",
                        optCarpet: "Teppichboden",
                        optTiles: "Fliesen / Keramik",
                        optPlaster: "Putz / Mauerwerk",
                        optConcrete: "Beton (glatt)",
                        optWood: "Holzvertäfelung",
                        optAcoustic: "Akustikdecke (Melamin/Basotect)",
                        chartTitle: "3. Nachhallzeit T60 im Frequenzverlauf",
                        statusOk: "Berechnung aktiv",
                        normInfo: "Gültige Norm: DIN 18041 / ÖNORM B 8115",
                        saveBtn: "In Neon DB speichern",
                        exportBtn: "Drucken / PDF"
                    },
                    ita: {
                        title: "Calcolatore Acustico",
                        subtitle: "Calcolo del tempo di riverberazione secondo Sabine",
                        projTitle: "Dati Progetto",
                        projName: "Nome progetto",
                        custName: "Cliente",
                        geoTitle: "1. Geometria della stanza",
                        length: "Lunghezza (m)",
                        width: "Larghezza (m)",
                        height: "Altezza (m)",
                        vol: "Volume",
                        area: "Superficie",
                        matTitle: "2. Superfici e Materiali",
                        floorMat: "Pavimento",
                        wallMat: "Pareti",
                        ceilingMat: "Soffitto",
                        optParquet: "Parquet / Duro",
                        optCarpet: "Moquette / Tappeto",
                        optTiles: "Piastrelle / Ceramica",
                        optPlaster: "Intonaco / Muratura",
                        optConcrete: "Cemento liscio",
                        optWood: "Rivestimento in legno",
                        optAcoustic: "Pannelli fonoassorbenti (Basotect)",
                        chartTitle: "3. Andamento del tempo di riverberazione T60",
                        statusOk: "Calcolo attivo",
                        normInfo: "Normativa di riferimento: DIN 18041",
                        saveBtn: "Salva su Neon DB",
                        exportBtn: "Stampa / PDF"
                    }
                },

                get t() { return this.dict[this.lang]; },
                setLang(l) { this.lang = l; },

                get volume() { 
                    let v = this.room.length * this.room.width * this.room.height;
                    return isNaN(v) ? 0 : v.toFixed(1); 
                },
                get totalArea() { 
                    let l = parseFloat(this.room.length) || 0;
                    let w = parseFloat(this.room.width) || 0;
                    let h = parseFloat(this.room.height) || 0;
                    let a = 2 * (l * w + l * h + w * h);
                    return a.toFixed(1);
                },

                init() {
                    this.$nextTick(() => { this.renderChart(); });
                },

                updateCalc() {
                    const freqs = [125, 250, 500, 1000, 2000, 4000];
                    let L = parseFloat(this.room.length) || 0;
                    let W = parseFloat(this.room.width) || 0;
                    let H = parseFloat(this.room.height) || 0;

                    let V = L * W * H;
                    let S_floor = L * W;
                    let S_ceiling = S_floor;
                    let S_walls = 2 * (L * H + W * H);

                    let fAlpha = dbMat[this.materials.floor];
                    let wAlpha = dbMat[this.materials.wall];
                    let cAlpha = dbMat[this.materials.ceiling];
                    let optAlpha = dbMat['basotect'];

                    this.currentRtValues = [];
                    this.optimizedRtValues = [];

                    for (let i = 0; i < freqs.length; i++) {
                        let A_curr = (S_floor * fAlpha[i]) + (S_walls * wAlpha[i]) + (S_ceiling * cAlpha[i]);
                        let A_opt = (S_floor * fAlpha[i]) + (S_walls * wAlpha[i]) + (S_ceiling * optAlpha[i]);

                        let t60_c = A_curr > 0 && V > 0 ? (0.161 * V / A_curr).toFixed(2) : 0;
                        let t60_o = A_opt > 0 && V > 0 ? (0.161 * V / A_opt).toFixed(2) : 0;

                        this.currentRtValues.push(parseFloat(t60_c));
                        this.optimizedRtValues.push(parseFloat(t60_o));
                    }

                    if (this.chartInstance) {
                        this.chartInstance.data.datasets[0].data = this.currentRtValues;
                        this.chartInstance.data.datasets[1].data = this.optimizedRtValues;
                        this.chartInstance.update();
                    }
                },

                renderChart() {
                    const ctx = document.getElementById('rtChart').getContext('2d');
                    this.chartInstance = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['125 Hz', '250 Hz', '500 Hz', '1 kHz', '2 kHz', '4 kHz'],
                            datasets: [
                                {
                                    label: 'Ist-Zustand / Stato attuale (T60)',
                                    data: [],
                                    borderColor: '#ef4444',
                                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                    tension: 0.2,
                                    fill: true
                                },
                                {
                                    label: 'Optimierter Zustand / Stato ottimizzato',
                                    data: [],
                                    borderColor: '#3b82f6',
                                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                    tension: 0.2,
                                    fill: true
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { beginAtZero: true, title: { display: true, text: 'Sekunden (s) / Secondi' } }
                            }
                        }
                    });
                    this.updateCalc();
                },

                async saveProject() {
                    let payload = {
                        project_name: this.project.name,
                        customer_name: this.project.customer,
                        length: this.room.length,
                        width: this.room.width,
                        height: this.room.height,
                        floor_material: this.materials.floor,
                        wall_material: this.materials.wall,
                        ceiling_material: this.materials.ceiling,
                        volume: parseFloat(this.volume),
                        rt_current: this.currentRtValues,
                        rt_optimized: this.optimizedRtValues
                    };

                    try {
                        let res = await fetch('/api/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        let data = await res.json();
                        if (res.ok) {
                            alert(this.lang === 'de' ? 'Erfolgreich in Neon DB gespeichert! ID: ' + data.id : 'Salvato con successo su Neon DB! ID: ' + data.id);
                        } else {
                            alert('Fehler beim Speichern');
                        }
                    } catch (e) {
                        console.error(e);
                        alert('Netzwerkfehler');
                    }
                }
            }
        }
    </script>
</body>
</html>
