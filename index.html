<!DOCTYPE html>
<html lang="de" x-data="acousticsApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raumakustik Rechner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf.js -->
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 font-sans">
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header & Language Switcher -->
        <header class="flex justify-between items-center bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center gap-3">
                <!-- Logo Dinamico del Brand -->
                <div x-html="brand.logoSvg"></div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900" x-text="t.title"></h1>
                    <p class="text-xs text-slate-500" x-text="brand.companyTagline"></p>
                </div>
            </div>
            <div class="flex gap-2">
                <button @click="lang = 'de'" :class="lang === 'de' ? 'bg-slate-900 text-white' : 'bg-slate-200 text-slate-700'" class="px-3 py-1 rounded-md font-semibold text-xs transition">DE</button>
                <button @click="lang = 'ita'" :class="lang === 'ita' ? 'bg-slate-900 text-white' : 'bg-slate-200 text-slate-700'" class="px-3 py-1 rounded-md font-semibold text-xs transition">ITA</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Inputs Panel -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-1 space-y-5">
                <h2 class="text-md font-bold text-slate-900 border-b pb-2 uppercase tracking-wide" x-text="t.params"></h2>
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase" x-text="t.projectName"></label>
                    <input type="text" x-model="projectName" class="w-full mt-1 p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase" x-text="t.customerName"></label>
                    <input type="text" x-model="customerName" class="w-full mt-1 p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-700" x-text="t.length"></label>
                        <input type="number" step="0.1" x-model.number="length" @input="updateDimensions" class="w-full mt-1 p-2 text-sm border border-slate-300 rounded-lg text-center">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700" x-text="t.width"></label>
                        <input type="number" step="0.1" x-model.number="width" @input="updateDimensions" class="w-full mt-1 p-2 text-sm border border-slate-300 rounded-lg text-center">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700" x-text="t.height"></label>
                        <input type="number" step="0.1" x-model.number="height" @input="updateDimensions" class="w-full mt-1 p-2 text-sm border border-slate-300 rounded-lg text-center">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase" x-text="t.floor"></label>
                    <select x-model="floorMaterial" @change="updateDimensions" class="w-full mt-1 p-2.5 text-sm border border-slate-300 rounded-lg bg-white">
                        <option value="parket">Parkett / Wooden Floor (0.05)</option>
                        <option value="beton">Beton / Concrete (0.02)</option>
                        <option value="teppich">Teppich / Carpet (0.25)</option>
                    </select>
                </div>

                <!-- Wall Materials breakdown -->
                <div class="border-t pt-4 space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-slate-700 uppercase" x-text="t.wallsBreakdown"></label>
                        <span class="text-xs font-semibold text-slate-500" x-text="t.totalWalls + ': ' + totalWallArea + ' m²'"></span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <span class="text-slate-600 font-medium" x-text="t.products.matGlas"></span>
                            <input type="number" step="0.5" x-model.number="walls.glas" @input="onWallAreaChange('glas')" class="w-full mt-1 p-2 border border-slate-300 rounded-md">
                        </div>
                        <div>
                            <span class="text-slate-600 font-medium" x-text="t.products.matPutz"></span>
                            <input type="number" step="0.5" x-model.number="walls.putz" @input="onWallAreaChange('putz')" class="w-full mt-1 p-2 border border-slate-300 rounded-md">
                        </div>
                        <div>
                            <span class="text-slate-600 font-medium" x-text="t.products.matHolz"></span>
                            <input type="number" step="0.5" x-model.number="walls.holz" @input="onWallAreaChange('holz')" class="w-full mt-1 p-2 border border-slate-300 rounded-md">
                        </div>
                        <div>
                            <span class="text-slate-600 font-medium" x-text="t.products.matBeton"></span>
                            <input type="number" step="0.5" x-model.number="walls.beton" @input="onWallAreaChange('beton')" class="w-full mt-1 p-2 border border-slate-300 rounded-md">
                        </div>
                    </div>
                </div>

                <!-- Ceiling Materials breakdown -->
                <div class="border-t pt-4 space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-slate-700 uppercase" x-text="t.ceilingBreakdown"></label>
                        <span class="text-xs font-semibold text-slate-500" x-text="t.totalCeiling + ': ' + totalCeilingArea + ' m²'"></span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <span class="text-slate-600 font-medium" x-text="t.products.matCeilingBeton"></span>
                            <input type="number" step="0.5" x-model.number="ceiling.beton" @input="onCeilingAreaChange('beton')" class="w-full mt-1 p-2 border border-slate-300 rounded-md">
                        </div>
                        <div>
                            <span class="text-slate-600 font-medium" x-text="t.products.matCeilingHolz"></span>
                            <input type="number" step="0.5" x-model.number="ceiling.holz" @input="onCeilingAreaChange('holz')" class="w-full mt-1 p-2 border border-slate-300 rounded-md">
                        </div>
                    </div>
                </div>

                <!-- Treatment Configuration -->
                <div class="border-t pt-4 space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wide" x-text="t.treatmentTitle"></h3>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1" x-text="t.productSelect"></label>
                        <select x-model="selectedProduct" @change="calculate" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white font-medium">
                            <option value="melamina" x-text="t.products.melamina"></option>
                            <option value="poliuretano" x-text="t.products.poliuretano"></option>
                            <option value="stratocell" x-text="t.products.stratocell"></option>
                            <option value="poliestere" x-text="t.products.poliestere"></option>
                            <option value="fibrotech" x-text="t.products.fibrotech"></option>
                        </select>
                    </div>

                    <div>
                        <div class="flex justify-between items-center text-xs font-semibold mb-1">
                            <span class="text-slate-600" x-text="t.treatmentPercentage"></span>
                            <span class="text-sky-600 font-bold text-sm" x-text="coveragePercentage + '% (' + coverageSquareMeters + ' m²)'"></span>
                        </div>
                        <input type="range" min="0" max="100" step="5" x-model.number="coveragePercentage" @input="updatePercentage" @change="updatePercentage" class="w-full accent-slate-900 cursor-pointer">
                    </div>
                </div>

                <!-- Action Buttons & Privacy Checkbox -->
                <div class="space-y-3 pt-2 border-t">
                    <!-- Privacy Checkbox -->
                    <div class="flex items-start gap-2 pt-1">
                        <input type="checkbox" id="privacyCheck" x-model="privacyAccepted" class="mt-0.5 h-4 w-4 rounded border-slate-300 text-slate-900 focus:ring-slate-900 cursor-pointer">
                        <label for="privacyCheck" class="text-[11px] text-slate-600 leading-tight cursor-pointer" x-text="t.privacyText"></label>
                    </div>

                    <button @click="saveProject" :disabled="!privacyAccepted" class="w-full bg-slate-900 text-white p-3 rounded-lg font-semibold hover:bg-slate-800 transition text-sm shadow-sm disabled:opacity-40 disabled:cursor-not-allowed" x-text="t.saveBtn"></button>
                    
                    <button @click="downloadPDF" class="w-full bg-sky-600 text-white p-3 rounded-lg font-semibold hover:bg-sky-700 transition text-sm shadow-sm" x-text="t.downloadPdf"></button>
                    
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button @click="shareWhatsApp" class="w-full bg-emerald-600 text-white p-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition text-xs flex items-center justify-center gap-1.5 shadow-sm">
                            <span>💬 WhatsApp</span>
                        </button>
                        <button @click="shareEmail" class="w-full bg-amber-600 text-white p-2.5 rounded-lg font-semibold hover:bg-amber-700 transition text-xs flex items-center justify-center gap-1.5 shadow-sm">
                            <span>✉️ Email</span>
                        </button>
                    </div>
                </div>
                <p x-text="saveStatus" class="text-xs text-center font-medium mt-2 text-slate-600"></p>
            </div>

            <!-- Results & Simulation Panel -->
            <div id="pdf-export-area" class="lg:col-span-2 space-y-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-xs">
                
                <!-- PDF Header -->
                <div class="flex justify-between items-center border-b pb-3">
                    <div class="flex items-center gap-3">
                        <div x-html="brand.logoSvg"></div>
                        <div>
                            <h2 class
