<!DOCTYPE html>
<html lang="de" x-data="acousticsApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raumakustik Rechner | Calcolatore Acustico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header & Language Switcher -->
        <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
            <h1 class="text-2xl font-bold text-slate-900" x-text="t.title"></h1>
            <div class="flex gap-2">
                <button @click="lang = 'de'" :class="lang === 'de' ? 'bg-blue-600 text-white' : 'bg-slate-200'" class="px-3 py-1 rounded font-medium text-sm transition">DE</button>
                <button @click="lang = 'ita'" :class="lang === 'ita' ? 'bg-blue-600 text-white' : 'bg-slate-200'" class="px-3 py-1 rounded font-medium text-sm transition">ITA</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Inputs Panel -->
            <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-1 space-y-4">
                <h2 class="text-lg font-semibold border-b pb-2" x-text="t.params"></h2>
                
                <div>
                    <label class="block text-sm font-medium" x-text="t.projectName"></label>
                    <input type="text" x-model="projectName" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium" x-text="t.customerName"></label>
                    <input type="text" x-model="customerName" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-medium" x-text="t.length"></label>
                        <input type="number" step="0.1" x-model.number="length" @input="updateDimensions" class="w-full mt-1 p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-medium" x-text="t.width"></label>
                        <input type="number" step="0.1" x-model.number="width" @input="updateDimensions" class="w-full mt-1 p-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-medium" x-text="t.height"></label>
                        <input type="number" step="0.1" x-model.number="height" @input="updateDimensions" class="w-full mt-1 p-2 border rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium" x-text="t.floor"></label>
                    <select x-model="floorMaterial" @change="calculate" class="w-full mt-1 p-2 border rounded-lg">
                        <option value="parket">Parkett / Wooden Floor (0.05)</option>
                        <option value="beton">Beton / Concrete (0.02)</option>
                        <option value="teppich">Teppich / Carpet (0.25)</option>
                    </select>
                </div>

                <!-- Wall Materials breakdown by m² -->
                <div class="border-t pt-3 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-700" x-text="t.wallsBreakdown"></label>
                        <span class="text-xs text-slate-500" x-text="t.totalWalls + ': ' + totalWallArea + ' m²'"></span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <span class="text-slate-600">Glas / Fenster (m²)</span>
                            <input type="number" step="0.5" x-model.number="walls.glas" @input="calculate" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                        <div>
                            <span class="text-slate-600">Putz (m²)</span>
                            <input type="number" step="0.5" x-model.number="walls.putz" @input="calculate" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                        <div>
                            <span class="text-slate-600">Holz (m²)</span>
                            <input type="number" step="0.5" x-model.number="walls.holz" @input="calculate" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                        <div>
                            <span class="text-slate-600">Beton (m²)</span>
                            <input type="number" step="0.5" x-model.number="walls.beton" @input="calculate" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                    </div>
                </div>

                <!-- Ceiling Materials breakdown by m² -->
                <div class="border-t pt-3 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-semibold text-slate-700" x-text="t.ceilingBreakdown"></label>
                        <span class="text-xs text-slate-500" x-text="t.totalCeiling + ': ' + totalCeilingArea + ' m²'"></span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <span class="text-slate-600">Beton Decke (m²)</span>
                            <input type="number" step="0.5" x-model.number="ceiling.beton" @input="calculate" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                        <div>
                            <span class="text-slate-600">Holz Decke (m²)</span>
                            <input type="number" step="0.5" x-model.number="ceiling.holz" @input="calculate" class="w-full mt-1 p-1.5 border rounded">
                        </div>
                    </div>
                </div>

                <!-- Catalog Treatment Configuration with Percentage Selector -->
                <div class="border-t pt-4 space-y-3 bg-indigo-50/50 p-3 rounded-lg border">
                    <h3 class="text-sm font-semibold text-indigo-700" x-text="t.treatmentTitle"></h3>
                    
                    <div>
                        <label class="block text-xs font-medium" x-text="t.productSelect"></label>
                        <select x-model="selectedProduct" @change="calculate" class="w-full mt-1 p-2 border rounded-lg text-sm bg-white">
                            <option value="melamina">Schiuma di Melamina / Basotect (5 cm)</option>
                            <option value="poliuretano">Poliuretano Espanso (5 cm)</option>
                            <option value="stratocell">Stratocell Whisper (5 cm)</option>
                            <option value="poliestere">Fibra di Poliestere (5 cm)</option>
                            <option value="fibrotech">FibroTech Pannelli dogati</option>
                        </select>
                    </div>

                    <div>
                        <div class="flex justify-between items-center text-xs font-medium">
                            <span x-text="t.treatmentPercentage"></span>
                            <span class="text-indigo-600 font-bold" x-text="coveragePercentage + '% (' + coverageSquareMeters + ' m²)'"></span>
                        </div>
                        <input type="range" min="0" max="100" step="5" x-model.number="coveragePercentage" @input="updatePercentage" class="w-full mt-2 accent-indigo-600">
                    </div>
                </div>

                <button @click="saveProject" class="w-full bg-emerald-600 text-white p-3 rounded-lg font-semibold hover:bg-emerald-700 transition" x-text="t.saveBtn"></button>
                <p x-text="saveStatus" class="text-sm text-center font-medium mt-2"></p>
            </div>

            <!-- Results & Simulation Panel -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Metrics Cards -->
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm">
                        <h3 class="text-xs text-slate-500" x-text="t.volume"></h3>
                        <p class="text-xl font-bold text-slate-900" x-text="volume + ' m³'"></p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm">
                        <h3 class="text-xs text-slate-500" x-text="t.rtCurrent"></h3>
                        <p class="text-xl font-bold text-blue-600" x-text="avgRtCurrent + ' s'"></p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm bg-indigo-50">
                        <h3 class="text-xs text-indigo-600 font-semibold" x-text="t.rtTreated"></h3>
                        <p class="text-xl font-bold text-indigo-700" x-text="avgRtTreated + ' s'"></p>
                    </div>
                </div>

                <!-- Manual Sound Level Meter Overrides -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-md font-semibold mb-2" x-text="t.manualTitle"></h3>
                    <p class="text-xs text-slate-500 mb-4" x-text="t.manualDesc"></p>
                    <div class="grid grid-cols-6 gap-2">
                        <template x-for="(freq, index) in frequencies" :key="freq">
                            <div>
                                <label class="block text-xs font-medium text-center text-slate-600" x-text="freq"></label>
                                <input type="number" step="0.05" x-model.number="rtCurrentData[index]" @input="updateChartFromManual" class="w-full mt-1 p-1 text-center text-sm border rounded-md">
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Chart Container -->
                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h3 class="text-lg font-semibold mb-4" x-text="t.chartTitle"></h3>
                    <div class="relative h-80">
                        <canvas id="acousticsChart"></canvas>
                    </div>
                </div>

                <!-- Audio Simulation Panel with Graphical Widget -->
                <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
                    <h3 class="text-lg font-semibold" x-text="t.audioTitle"></h3>
                    <p class="text-sm text-slate-500" x-text="t.audioDesc"></p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Before Widget -->
                        <div class="p-4 border rounded-xl bg-amber-50/50 flex flex-col justify-between space-y-3">
                            <div>
                                <h4 class="font-semibold text-amber-900 text-sm" x-text="t.playBefore"></h4>
                                <p class="text-xs text-amber-700/80">Riverbero stimato: <span class="font-bold" x-text="avgRtCurrent + ' s'"></span></p>
                            </div>
                            <!-- Graphical Waveform Widget -->
                            <div class="flex items-center justify-between gap-1 h-10 px-2 bg-white/80 rounded border border-amber-200">
                                <template x-for="i in 16">
                                    <div class="w-1 bg-amber-400 rounded-full transition-all duration-300" :style="isPlayingBefore ? `height: ${Math.max(15, Math.random() * 32)}px` : 'height: 6px'"></div>
                                </template>
                            </div>
                            <button @click="playAudio('before')" :disabled="isPlayingBefore || isPlayingAfter" class="w-full bg-amber-600 text-white py-2 rounded-lg font-medium hover:bg-amber-700 transition disabled:opacity-50 text-sm">
                                <span x-text="isPlayingBefore ? 'Playing...' : t.playBefore"></span>
                            </button>
                        </div>

                        <!-- After Widget -->
                        <div class="p-4 border rounded-xl bg-indigo-50/50 flex flex-col justify-between space-y-3">
                            <div>
                                <h4 class="font-semibold text-indigo-900 text-sm" x-text="t.playAfter"></h4>
                                <p class="text-xs text-indigo-700/80">Riverbero trattato: <span class="font-bold" x-text="avgRtTreated + ' s'"></span></p>
                            </div>
                            <!-- Graphical Waveform Widget -->
                            <div class="flex items-center justify-between gap-1 h-10 px-2 bg-white/80 rounded border border-indigo-200">
                                <template x-for="i in 16">
                                    <div class="w-1 bg-indigo-400 rounded-full transition-all duration-300" :style="isPlayingAfter ? `height: ${Math.max(8, Math.random() * 18)}px` : 'height: 6px'"></div>
                                </template>
                            </div>
                            <button @click="playAudio('after')" :disabled="isPlayingBefore || isPlayingAfter" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition disabled:opacity-50 text-sm">
                                <span x-text="isPlayingAfter ? 'Playing...' : t.playAfter"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            de: {
                title: "Raumakustik & Nachhallzeit Rechner",
                params: "Raumparameter",
                projectName: "Projektname",
                customerName: "Kunde",
                length: "Länge (m)",
                width: "Breite (m)",
                height: "Höhe (m)",
                floor: "Bodenbelag",
                wallsBreakdown: "Wandmaterialien (Flächen in m²)",
                totalWalls: "Gesamtwand",
                ceilingBreakdown: "Deckenmaterialien (Flächen in m²)",
                totalCeiling: "Gesamtdecke",
                treatmentTitle: "Akustik-Produkt & Behandlung",
                productSelect: "Produkt aus Katalog",
                treatmentPercentage: "Zu behandelnde Fläche (%)",
                saveBtn: "In Neon DB speichern",
                volume: "Raumvolumen",
                rtCurrent: "Nachhallzeit Ist",
                rtTreated: "Nachhallzeit Mit Projekt",
                manualTitle: "Manuelle Messwerte (Fonometer / Hz)",
                manualDesc: "Überschreiben Sie die berechneten Werte mit echten Messdaten pro Frequenz.",
                chartTitle: "Nachhallzeit T60 nach Frequenzen (Sekunden)",
                audioTitle: "Akustik-Simulation (Vorher / Nachher)",
                audioDesc: "Hören Sie den simulierten Nachhall im Raum basierend auf der aktuellen Raumgröße und Behandlung.",
                playBefore: "Vorher (Ohne Dämmung)",
                playAfter: "Nachher (Mit Akustik)",
                saved: "Erfolgreich gespeichert!",
                error: "Fehler beim Speichern."
            },
            ita: {
                title: "Calcolatore Acustico e Tempo di Riverbero",
                params: "Parametri della Stanza",
                projectName: "Nome Progetto",
                customerName: "Cliente",
                length: "Lunghezza (m)",
                width: "Larghezza (m)",
                height: "Altezza (m)",
                floor: "Pavimento",
                wallsBreakdown: "Materiale Pareti (Superficie in m²)",
                totalWalls: "Totale pareti",
                ceilingBreakdown: "Materiale Soffitto (Superficie in m²)",
                totalCeiling: "Totale soffitto",
                treatmentTitle: "Trattamento & Scelta Prodotto",
                productSelect: "Prodotto a Catalogo",
                treatmentPercentage: "Percentuale di superficie da trattare",
                saveBtn: "Salva nel Database Neon",
                volume: "Volume Stanza",
                rtCurrent: "Riverbero Attuale",
                rtTreated: "Riverbero Trattato",
                manualTitle: "Rilievi Fonometrici Manuali (Hz)",
                manualDesc: "Modifica direttamente i valori attuali inserendo le misurazioni rilevate con il fonometro.",
                chartTitle: "Tempo di Riverbero T60 per Frequenze (Secondi)",
                audioTitle: "Simulazione Acustica (Prima / Dopo)",
                audioDesc: "Ascolta il riverbero simulato nella stanza in base alle dimensioni attuali e al trattamento scelto.",
                playBefore: "Prima (Senza Pannelli)",
                playAfter: "Dopo (Con Trattamento)",
                saved: "Salvato con successo!",
                error: "Errore durante il salvataggio."
            }
        };

        const absorptionCoefficients = {
            parket: { 125: 0.04, 250: 0.04, 500: 0.03, 1000: 0.03, 2000: 0.02, 4000: 0.02 },
            beton: { 125: 0.01, 250: 0.01, 500: 0.02, 1000: 0.02, 2000: 0.03, 4000: 0.04 },
            teppich: { 125: 0.02, 250: 0.08, 500: 0.25, 1000: 0.45, 2000: 0.65, 4000: 0.75 },
            glas: { 125: 0.10, 250: 0.05, 500: 0.03, 1000: 0.02, 2000: 0.02, 4000: 0.02 },
            putz: { 125: 0.02, 250: 0.03, 500: 0.04, 1000: 0.05, 2000: 0.04, 4000: 0.03 },
            holz: { 125: 0.15, 250: 0.12, 500: 0.10, 1000: 0.08, 2000: 0.07, 4000: 0.06 }
        };

        const productCoefficients = {
            melamina: { 125: 0.15, 250: 0.45, 500: 0.85, 1000: 0.95, 2000: 0.95, 4000: 0.90 },
            poliuretano: { 125: 0.12, 250: 0.35, 500: 0.75, 1000: 0.85, 2000: 0.80, 4000: 0.75 },
            stratocell: { 125: 0.20, 250: 0.55, 500: 0.90, 1000: 0.95, 2000: 0.90, 4000: 0.85 },
            poliestere: { 125: 0.18, 250: 0.50, 500: 0.88, 1000: 0.92, 2000: 0.88, 4000: 0.82 },
            fibrotech: { 125: 0.10, 250: 0.30, 500: 0.75, 1000: 0.90, 2000: 0.80, 4000: 0.70 }
        };

        function acousticsApp() {
            return {
                lang: 'ita',
                projectName: 'Ufficio Seron',
                customerName: 'Cliente Test',
                length: 6.0,
                width: 4.0,
                height: 2.8,
                floorMaterial: 'parket',
                walls: {
                    glas: 6.0,
                    putz: 30.0,
                    holz: 0.0,
                    beton: 4.0
                },
                ceiling: {
                    beton: 24.0,
                    holz: 0.0
                },
                selectedProduct: 'melamina',
                coveragePercentage: 35, // Default 35%
                coverageSquareMeters: 14.0,
                volume: 67.2,
                totalWallArea: 40.0,
                totalCeilingArea: 24.0,
                avgRtCurrent: 0.0,
                avgRtTreated: 0.0,
                rtCurrentData: [1.8, 2.1, 1.9, 1.6, 1.3, 1.0],
                rtOptimizedData: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5],
                rtTreatedData: [1.2, 1.3, 1.0, 0.8, 0.7, 0.6],
                saveStatus: '',
                chart: null,
                frequencies: ['125 Hz', '250 Hz', '500 Hz', '1000 Hz', '2000 Hz', '4000 Hz'],
                isPlayingBefore: false,
                isPlayingAfter: false,

                get t() { return translations[this.lang]; },

                init() {
                    this.updateDimensions();
                    this.$nextTick(() => {
                        const ctx = document.getElementById('acousticsChart').getContext('2d');
                        this.chart = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: this.frequencies,
                                datasets: [
                                    {
                                        label: 'T60 Attuale (s)',
                                        data: this.rtCurrentData,
                                        borderColor: '#2563eb',
                                        backgroundColor: 'rgba(37, 99, 235, 0.05)',
                                        borderWidth: 2,
                                        tension: 0.3,
                                        fill: false
                                    },
                                    {
                                        label: 'T60 Obiettivo Ottimale (s)',
                                        data: this.rtOptimizedData,
                                        borderColor: '#10b981',
                                        backgroundColor: 'rgba(16, 185, 129, 0.05)',
                                        borderWidth: 2,
                                        borderDash: [5, 5],
                                        tension: 0.3,
                                        fill: false
                                    },
                                    {
                                        label: 'T60 Con Trattamento Scelto (s)',
                                        data: this.rtTreatedData,
                                        borderColor: '#8b5cf6',
                                        backgroundColor: 'rgba(139, 92, 246, 0.1)',
                                        borderWidth: 3,
                                        tension: 0.3,
                                        fill: true
                                    }
                                ]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: { 
                                    y: { 
                                        beginAtZero: true, 
                                        max: 3.5,
                                        ticks: { stepSize: 0.5 }
                                    } 
                                }
                            }
                        });
                    });
                },

                updateDimensions() {
                    this.volume = parseFloat((this.length * this.width * this.height).toFixed(2));
                    const perimeter = 2 * (this.length + this.width);
                    this.totalWallArea = parseFloat((perimeter * this.height).toFixed(1));
                    this.totalCeilingArea = parseFloat((this.length * this.width).toFixed(1));
                    
                    // Default distribution
                    this.walls.putz = parseFloat((this.totalWallArea * 0.7).toFixed(1));
                    this.walls.glas = parseFloat((this.totalWallArea * 0.2).toFixed(1));
                    this.walls.beton = parseFloat((this.totalWallArea * 0.1).toFixed(1));
                    this.walls.holz = 0.0;

                    this.ceiling.beton = this.totalCeilingArea;
                    this.ceiling.holz = 0.0;

                    this.updatePercentage();
                },

                updatePercentage() {
                    const totalSurface = this.totalWallArea + this.totalCeilingArea;
                    this.coverageSquareMeters = parseFloat(((totalSurface * this.coveragePercentage) / 100).toFixed(1));
                    this.calculate();
                },

                calculate() {
                    this.volume = parseFloat((this.length * this.width * this.height).toFixed(2));
                    const floorArea = this.length * this.width;

                    const freqs = [125, 250, 500, 1000, 2000, 4000];
                    let currentRtList = [];
                    let treatedRtList = [];
                    let optimizedRtList = [];

                    freqs.forEach(f => {
                        const aFloor = (absorptionCoefficients[this.floorMaterial] ? absorptionCoefficients[this.floorMaterial][f] : 0.03) * floorArea;
                        
                        const aCeilingBeton = absorptionCoefficients.beton[f] * (this.ceiling.beton || 0);
                        const aCeilingHolz = absorptionCoefficients.holz[f] * (this.ceiling.holz || 0);
                        
                        const aGlas = absorptionCoefficients.glas[f] * (this.walls.glas || 0);
                        const aPutz = absorptionCoefficients.putz[f] * (this.walls.putz || 0);
                        const aHolz = absorptionCoefficients.holz[f] * (this.walls.holz || 0);
                        const aBeton = absorptionCoefficients.beton[f] * (this.walls.beton || 0);

                        const totalAbsorptionCurrent = aFloor + aCeilingBeton + aCeilingHolz + aGlas + aPutz + aHolz + aBeton + (0.16 * this.volume / 40);
                        let rtCurr = (0.16 * this.volume) / Math.max(0.1, totalAbsorptionCurrent);
                        currentRtList.push(parseFloat(rtCurr.toFixed(2)));

                        optimizedRtList.push(0.50);

                        // Trattamento con prodotto da catalogo in base ai m² percentuali
                        const productAlpha = productCoefficients[this.selectedProduct][f];
                        const treatedArea = Math.min(this.coverageSquareMeters, (this.totalWallArea + this.totalCeilingArea));
                        
                        const effectiveAbsorptionTreated = totalAbsorptionCurrent + (productAlpha * treatedArea) - (0.04 * treatedArea);
                        let rtTreated = (0.16 * this.volume) / Math.max(0.1, effectiveAbsorptionTreated);
                        treatedRtList.push(parseFloat(Math.max(0.2, rtTreated).toFixed(2)));
                    });

                    this.rtCurrentData = currentRtList;
                    this.rtOptimizedData = optimizedRtList;
                    this.rtTreatedData = treatedRtList;
                    
                    const sumCurr = currentRtList.reduce((a, b) => a + b, 0);
                    this.avgRtCurrent = parseFloat((sumCurr / currentRtList.length).toFixed(2));

                    const sumTreated = treatedRtList.reduce((a, b) => a + b, 0);
                    this.avgRtTreated = parseFloat((sumTreated / treatedRtList.length).toFixed(2));

                    if (this.chart) {
                        this.chart.data.datasets[0].data = this.rtCurrentData;
                        this.chart.data.datasets[1].data = this.rtOptimizedData;
                        this.chart.data.datasets[2].data = this.rtTreatedData;
                        this.chart.update();
                    }
                },

                updateChartFromManual() {
                    const sum = this.rtCurrentData.reduce((a, b) => a + (parseFloat(b) || 0), 0);
                    this.avgRtCurrent = parseFloat((sum / this.rtCurrentData.length).toFixed(2));
                    if (this.chart) {
                        this.chart.data.datasets[0].data = this.rtCurrentData;
                        this.chart.update();
                    }
                },

                playAudio(type) {
                    if (type === 'before') this.isPlayingBefore = true;
                    else this.isPlayingAfter = true;

                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const bufferSize = audioCtx.sampleRate * 3;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = buffer.getChannelData(0);

                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }

                    const whiteNoise = audioCtx.createBufferSource();
                    whiteNoise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = type === 'before' ? 3200 : 1400;

                    const gainNode = audioCtx.createGain();
                    const now = audioCtx.currentTime;
                    
                    const decay = type === 'before' ? Math.min(3.0, Math.max(0.8, this.avgRtCurrent)) : Math.min(2.0, Math.max(0.3, this.avgRtTreated));
                    
                    gainNode.gain.setValueAtTime(0.6, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + decay);

                    whiteNoise.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    whiteNoise.start(now);
                    whiteNoise.stop(now + decay);

                    setTimeout(() => {
                        this.isPlayingBefore = false;
                        this.isPlayingAfter = false;
                    }, decay * 1000);
                },

                async saveProject() {
                    try {
                        const response = await fetch('/api/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                project_name: this.projectName,
                                customer_name: this.customerName,
                                length: this.length,
                                width: this.width,
                                height: this.height,
                                volume: this.volume,
                                walls: this.walls,
                                ceiling: this.ceiling,
                                selected_product: this.selectedProduct,
                                coverage_percentage: this.coveragePercentage,
                                coverage_sqm: this.coverageSquareMeters,
                                rt_current: this.rtCurrentData,
                                rt_treated: this.rtTreatedData
                            })
                        });
                        const data = await response.json();
                        if (data.success) {
                            this.saveStatus = this.t.saved;
                        } else {
                            this.saveStatus = this.t.error;
                        }
                    } catch (e) {
                        this.saveStatus = this.t.error;
                    }
                }
            }
        }
    </script>
